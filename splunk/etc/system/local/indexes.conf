# Custom Index for Threat Hunt Lab
# This file is mounted to /opt/splunk/etc/system/local/indexes.conf

[threathunt]
homePath = $SPLUNK_DB/threathunt/db
coldPath = $SPLUNK_DB/threathunt/colddb
thawedPath = $SPLUNK_DB/threathunt/thaweddb
maxDataSize = auto_high_volume
maxHotBuckets = 3
maxWarmDBCount = 100
frozenTimePeriodInSecs = 7776000  # 90 days
rotatePeriodInSecs = 86400
maxTotalDataSizeMB = 5120